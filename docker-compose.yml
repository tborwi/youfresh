services:
  youfresh:
    build: ./server
    image: youfresh:latest
    container_name: youfresh
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      - TZ=Etc/UTC                # your time zone, e.g. America/New_York or Europe/London
      - PUID=1000                 # your user and group ids (run `id` to see them), so the
      - PGID=1000                 #   takeout/ and cookies/ folders are yours to copy files into
      - REFRESH_MINUTES=30        # how often to check channels for new videos
      - HISTORY_HOURS=2           # how often to sync YouTube history and Watch Later (if cookies are added)
      - SUBS_SYNC_HOUR=3          # local hour of the nightly YouTube subscriptions sync (-1 = off)
    volumes:
      # Creates ./youfresh/{takeout,cookies,data} next to this file on first start
      - ./youfresh:/youfresh
