plugins {
    id 'com.android.application'
}

// Release signing: put your own key details in android/keystore.properties (never commit it):
//   storeFile=/path/to/youfresh-release.jks
//   storePassword=...
//   keyAlias=youfresh
//   keyPassword=...
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'io.github.tborwi.youfresh'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.tborwi.youfresh'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
